
<div class="nav flex row justify-between items-center h-16 mb-10">
  <p class="w-fit font-bold text-[32px] text-[var(--text-color)]">Up to -40% 🎊 Order.uk exclusive deals</p>
  <div class="tabs flex row justify-between items-center w-fit ">
    <div class="rounded-[120px] font-normal text-[16px] border-1 border-white hover:border-[var(--primary-color)] hover:text-[var(--primary-color)] cursor-pointer my-0 mx-2.5 py-4.5 px-5.5 transition transition-all ease-linear duration-150 ">Vegan</div>
    <div class="rounded-[120px] font-normal text-[16px] border-1 border-white hover:border-[var(--primary-color)] hover:text-[var(--primary-color)] cursor-pointer my-0 mx-2.5 py-4.5 px-5.5 transition transition-all ease-linear duration-150 ">Sushi</div>
    <div class="min-w-fit rounded-[120px] font-normal text-[16px] border-1 border-white hover:border-[var(--primary-color)] hover:text-[var(--primary-color)] cursor-pointer my-0 mx-2.5 py-4.5 px-5.5 transition transition-all ease-linear duration-150 ">Piazza & Fast food</div>
    <div class="rounded-[120px] font-normal text-[16px] border-1 border-white hover:border-[var(--primary-color)] hover:text-[var(--primary-color)] cursor-pointer my-0 mx-2.5 py-4.5 px-5.5 transition transition-all ease-linear duration-150 ">others</div>
  </div>
</div>
<div class="cards flex row justify-between items-center mb-16 gap-5">
  <div class="card relative">
    <img [src]=cards[0].image alt="exclu1" />
    <p class="title absolute bottom-20 font-medium text-[18px] text-[var(--primary-color)] left-12">{{title}}</p>
    <p class="desc absolute bottom-12 left-12 text-[var(--secondary-color)] font-bold text-2xl ">{{cards[0].describtion}}</p>
    <span class="absolute top-0 right-5 w-22 h-16 rounded-b-xl bg-black text-white font-bold text-center content-center ">{{cards[0].discount}}</span>
  </div>
